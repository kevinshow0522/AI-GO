name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build the sidebar
        shell: powershell
        run: .\build.ps1

      # The rail drawn by its own code, in every state and theme, to look at.
      - name: Render the rail preview
        shell: powershell
        run: .\preview.ps1 -Windows

      - name: Compile the regression programs
        shell: powershell
        run: .\test.ps1 -SkipBuild -CompileOnly -FetchWebView2

      # The default branch is the reference: Verify compares against it, and
      # running the same tests on it shows whether a failure is new.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: baseline-src

      - name: Build the reference sidebar
        shell: powershell
        run: .\baseline-src\build.ps1 -OutputPath (Join-Path $PWD 'build\baseline\AISwitchDesk.exe')

      # The reference goes first: the first browser launch on a fresh machine
      # can take the foreground, which one test treats as a failure.
      - name: Run the regression programs on the reference (informational)
        shell: powershell
        continue-on-error: true
        run: .\test.ps1 -SkipBuild -FetchWebView2 -App build\baseline\AISwitchDesk.exe -Baseline build\baseline\AISwitchDesk.exe -TimeoutSeconds 180 *>&1 | Tee-Object -FilePath build\test-log-reference.txt

      # These drive real windows, so a hosted runner can fail them for reasons
      # unrelated to the change. Their result is reported but does not gate.
      - name: Run the regression programs (informational)
        shell: powershell
        continue-on-error: true
        run: .\test.ps1 -SkipBuild -FetchWebView2 -Baseline build\baseline\AISwitchDesk.exe -TimeoutSeconds 180 *>&1 | Tee-Object -FilePath build\test-log.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AISwitchDesk
          path: |
            build/AISwitchDesk.exe
            build/test-log.txt
            build/test-log-reference.txt
            build/preview/*.png
            build/preview/windows/*.png
          if-no-files-found: warn
